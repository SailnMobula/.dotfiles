# ──── Prefix ────
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ──── True color support (critical for Alacritty + Catppuccin) ────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",alacritty:RGB"

# ──── Vim-style pane navigation ────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ──── Intuitive splits (and open in current path) ────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind %
unbind '"'

# ──── Pane resizing (prefix + H/J/K/L) ────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ──── Vi copy mode ────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# ──── Mouse support ────
set -g mouse on

# ──── Quality of life ────
set -g base-index 1              # windows start at 1, not 0
setw -g pane-base-index 1        # panes too
set -g renumber-windows on       # re-number when closing
set -g escape-time 0             # no delay after Esc (crucial for Neovim)
set -g history-limit 50000       # generous scrollback
set -g focus-events on           # needed for Neovim autoread

# ──── Reload config quickly ────
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ──── New windows in current path ────
bind c new-window -c "#{pane_current_path}"
